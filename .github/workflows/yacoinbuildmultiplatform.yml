name: Yacoin multi platform build

on: [push, pull_request]

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Pushes (master merges
# included) each get their own group, so release builds are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-ubuntu-1604:
    runs-on: ubuntu-latest  
    timeout-minutes: 60
    env:
      IMAGE: ubuntu.16.04-2
    steps:
      - uses: actions/checkout@v6
      - name: cache dir and key
        run: |
          echo "REL_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "CACHE_KEY=release-$IMAGE-v1-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
          # Pushes to master and release tags build from scratch; only master
          # saves the cache. Branches and PRs reuse it.
          clean=false; save=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            case "$GITHUB_REF" in
              refs/heads/master) clean=true; save=true ;;
              refs/tags/*) clean=true ;;
            esac
          fi
          echo "CLEAN_BUILD=$clean" >> "$GITHUB_ENV"
          echo "SAVE_CACHE=$save" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        if: env.CLEAN_BUILD != 'true'
        with:
          path: ${{ env.REL_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-
            release-${{ env.IMAGE }}-v1-
      - name: build
        # Below the job timeout. Pushes to master and tags build from scratch
        # (nothing restored); other runs reuse the cached depends packages and
        # the ccache of the last master build (the entrypoint keeps both in
        # /cache).
        timeout-minutes: 50
        run: |
          mkdir -p "$REL_CACHE"
          docker run --rm --init --name release-build -v "$GITHUB_WORKSPACE":/src -v "$REL_CACHE":/cache \
            -e CCACHE_COMPRESS=1 -e CCACHE_MAXSIZE=1G \
            -e BUILDVERSION=$GITHUB_RUN_NUMBER "dev34253/yacoin-build:$IMAGE"
      - name: stop the container and make the cache readable for saving
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f release-build 2>/dev/null || true
          if [ -d "$REL_CACHE" ]; then sudo chown -R "$(id -u):$(id -g)" "$REL_CACHE"; fi
      - uses: actions/cache/save@v5
        if: success() && env.SAVE_CACHE == 'true'
        with:
          path: ${{ env.REL_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v6
        with:
          name: yacoind-ubuntu-16.04
          path: /home/runner/work/yacoin/yacoin/release-root/bin/yacoind
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: yacoin-qt-ubuntu-16.04
          path: /home/runner/work/yacoin/yacoin/release-root/bin/yacoin-qt
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: yacoin-cli-ubuntu-16.04
          path: /home/runner/work/yacoin/yacoin/release-root/bin/yacoin-cli
          if-no-files-found: error
  functional-tests:
    # Low-difficulty build of yacoind and yacoin-cli, then the functional
    # tests serially (functional-tests mode of the yacoin-build image, Python
    # 3.10). Cached and saved like the unit-tests job, in its own namespace.
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      IMAGE: ubuntu.22.04-2
    steps:
      - uses: actions/checkout@v6
      - name: cache dir and key
        run: |
          echo "FUNC_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "CACHE_KEY=functional-tests-$IMAGE-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        with:
          path: ${{ env.FUNC_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-
            functional-tests-${{ env.IMAGE }}-
      - name: build and run the functional tests
        # Below the job timeout, so a hang fails this step and the logs are
        # still uploaded.
        timeout-minutes: 45
        run: |
          mkdir -p "$FUNC_CACHE"
          docker run --rm --init --name functional-tests -v "$GITHUB_WORKSPACE":/src -v "$FUNC_CACHE":/cache \
            -e CCACHE_COMPRESS=1 -e CCACHE_MAXSIZE=2G \
            "dev34253/yacoin-build:$IMAGE" functional-tests
      - name: stop the container and make the cache and logs readable
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f functional-tests 2>/dev/null || true
          # The nodes write their datadirs with umask 077 as root.
          sudo chown -R "$(id -u):$(id -g)" "$FUNC_CACHE"
          if [ -d build ]; then sudo chown -R "$(id -u):$(id -g)" build; fi
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        with:
          path: ${{ env.FUNC_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: functional-test-logs
          path: |
            build/docker-*/functional-tests/test/tmp/test_runner_*/**/*.log
            build/docker-*/functional-tests/test/tmp/test_runner_*/**/std*/*
            build/docker-*/functional-tests/config.log
          retention-days: 14
  unit-tests:
    # Mainnet consensus build of test_bitcoin, every unit test suite in
    # parallel (unit-tests mode of the yacoin-build image). Depends packages,
    # depends sources and ccache are kept in /cache between runs; only master
    # pushes save that cache, so PR runs can't evict it.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ubuntu.16.04-2
    steps:
      - uses: actions/checkout@v6
      - name: cache dir and key
        run: |
          echo "UNIT_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "CACHE_KEY=unit-tests-$IMAGE-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        with:
          path: ${{ env.UNIT_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-
            unit-tests-${{ env.IMAGE }}-
      - name: build and run the unit tests
        # Below the job timeout, so a hang fails this step and the logs are
        # still uploaded.
        timeout-minutes: 50
        run: |
          mkdir -p "$UNIT_CACHE"
          docker run --rm --init --name unit-tests -v "$GITHUB_WORKSPACE":/src -v "$UNIT_CACHE":/cache \
            -e CCACHE_COMPRESS=1 -e CCACHE_MAXSIZE=2G \
            "dev34253/yacoin-build:$IMAGE" unit-tests
      - name: stop the container and make the cache readable for saving
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f unit-tests 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$UNIT_CACHE"
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        with:
          path: ${{ env.UNIT_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: unit-test-logs
          path: |
            build/docker-*/unit-tests/unit-test-logs/
            build/docker-*/unit-tests/config.log
          retention-days: 14
  build-ubuntu-1604-low-difficulty:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ubuntu.16.04-2
    steps:
      - uses: actions/checkout@v6
      - name: cache dir and key
        run: |
          echo "REL_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "CACHE_KEY=release-$IMAGE-v1-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
          # Pushes to master and release tags build from scratch; only master
          # saves the cache. Branches and PRs reuse it.
          clean=false; save=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            case "$GITHUB_REF" in
              refs/heads/master) clean=true; save=true ;;
              refs/tags/*) clean=true ;;
            esac
          fi
          echo "CLEAN_BUILD=$clean" >> "$GITHUB_ENV"
          echo "SAVE_CACHE=$save" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        if: env.CLEAN_BUILD != 'true'
        with:
          path: ${{ env.REL_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-
            release-${{ env.IMAGE }}-v1-
      - name: build
        # Build a low-difficulty yacoind using the depends system, mirroring
        # build-ubuntu-1604 (depends, glibc-back-compat, static-libstdc++) so
        # the resulting binary is portable to Ubuntu 16.04 and later — but with
        # --enable-low-difficulty-for-development added to the configure step
        # so mainnet PoW limits are relaxed enough for miner end-to-end testing.
        # See doc/cross-compilation-with-depends-system.md for the source of
        # the depends + configure commands chained here.
        # The depends packages come from the 16.04 release job's cache (same
        # image, same packages; the entrypoint keeps them under
        # /cache/ubuntu.16.04, without the -2 suffix). This job never saves a
        # cache. Pushes to master and tags restore nothing and build from scratch.
        timeout-minutes: 50
        run: |
          mkdir -p "$REL_CACHE"
          docker run --rm --init --name low-difficulty-build -v "$GITHUB_WORKSPACE":/src -v "$REL_CACHE":/cache \
            -e BUILDVERSION=$GITHUB_RUN_NUMBER --entrypoint /bin/bash "dev34253/yacoin-build:$IMAGE" -c "cd /src/depends && make -j 4 HOST=x86_64-pc-linux-gnu BASE_CACHE=/cache/ubuntu.16.04/depends-built SOURCES_PATH=/cache/depends-sources && cd /src && ./autogen.sh && CONFIG_SITE=/src/depends/x86_64-pc-linux-gnu/share/config.site ./configure --enable-glibc-back-compat --enable-reduce-exports --enable-low-difficulty-for-development LDFLAGS=-static-libstdc++ --prefix=/ && make -j 4 && make install DESTDIR=/src/release-root"
      - name: stop the container
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f low-difficulty-build 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        with:
          name: yacoind-low-difficulty-16.04
          path: /home/runner/work/yacoin/yacoin/release-root/bin/yacoind
          if-no-files-found: error
