name: Yacoin multi platform build

on: [push, pull_request]

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Pushes (master merges
# included) each get their own group, so release builds are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-ubuntu-1604:
    runs-on: ubuntu-latest  
    steps:
      - uses: actions/checkout@v3
      - name: build
        run: |
          docker run -v /home/runner/work/yacoin/yacoin:/src -e BUILDVERSION=$GITHUB_RUN_NUMBER dev34253/yacoin-build:ubuntu.16.04-1
      - uses: actions/upload-artifact@v4
        with:
          name: yacoind-ubuntu-16.04
          path: /home/runner/work/yacoin/yacoin/release-root/bin/yacoind
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yacoin-qt-ubuntu-16.04
          path: /home/runner/work/yacoin/yacoin/release-root/bin/yacoin-qt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yacoin-cli-ubuntu-16.04
          path: /home/runner/work/yacoin/yacoin/release-root/bin/yacoin-cli
          if-no-files-found: error
  build-ubuntu-1604-functional-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: build
        run: |
          docker run -v /home/runner/work/yacoin/yacoin:/src --entrypoint /bin/bash dev34253/yacoin-build:ubuntu.16.04 -c "cd /src && ./autogen.sh && ./configure --with-gui=no --enable-low-difficulty-for-development && make -j 2"
          docker run -v /home/runner/work/yacoin/yacoin:/src --entrypoint /src/test/functional/test_runner.py dev34253/yacoin-build:ubuntu.16.04 -j 1
  unit-tests:
    # Mainnet consensus build of test_bitcoin, every unit test suite in
    # parallel (unit-tests mode of the yacoin-build image). Depends packages,
    # depends sources and ccache are kept in /cache between runs; only master
    # pushes save that cache, so PR runs can't evict it.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ubuntu.16.04-2
    steps:
      - uses: actions/checkout@v6
      - name: cache dir and key
        run: |
          echo "UNIT_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "CACHE_KEY=unit-tests-$IMAGE-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        with:
          path: ${{ env.UNIT_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-
            unit-tests-${{ env.IMAGE }}-
      - name: build and run the unit tests
        # Below the job timeout, so a hang fails this step and the logs are
        # still uploaded.
        timeout-minutes: 50
        run: |
          mkdir -p "$UNIT_CACHE"
          docker run --rm --init --name unit-tests -v "$GITHUB_WORKSPACE":/src -v "$UNIT_CACHE":/cache \
            -e CCACHE_COMPRESS=1 -e CCACHE_MAXSIZE=2G \
            "dev34253/yacoin-build:$IMAGE" unit-tests
      - name: stop the container and make the cache readable for saving
        if: always()
        run: |
          # A step timeout stops docker run, but not always the container.
          docker rm -f unit-tests 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$UNIT_CACHE"
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        with:
          path: ${{ env.UNIT_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: unit-test-logs
          path: |
            build/docker-*/unit-tests/unit-test-logs/
            build/docker-*/unit-tests/config.log
          retention-days: 14
  build-ubuntu-1604-low-difficulty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: build
        # Build a low-difficulty yacoind using the depends system, mirroring
        # build-ubuntu-1604 (depends, glibc-back-compat, static-libstdc++) so
        # the resulting binary is portable to Ubuntu 16.04 and later — but with
        # --enable-low-difficulty-for-development added to the configure step
        # so mainnet PoW limits are relaxed enough for miner end-to-end testing.
        # See doc/cross-compilation-with-depends-system.md for the source of
        # the depends + configure commands chained here.
        run: |
          docker run -v /home/runner/work/yacoin/yacoin:/src -e BUILDVERSION=$GITHUB_RUN_NUMBER --entrypoint /bin/bash dev34253/yacoin-build:ubuntu.16.04-1 -c "cd /src/depends && make -j 4 HOST=x86_64-pc-linux-gnu && cd /src && ./autogen.sh && CONFIG_SITE=/src/depends/x86_64-pc-linux-gnu/share/config.site ./configure --enable-glibc-back-compat --enable-reduce-exports --enable-low-difficulty-for-development LDFLAGS=-static-libstdc++ --prefix=/ && make -j 4 && make install DESTDIR=/src/release-root"
      - uses: actions/upload-artifact@v4
        with:
          name: yacoind-low-difficulty-16.04
          path: /home/runner/work/yacoin/yacoin/release-root/bin/yacoind
          if-no-files-found: error
  build-ubuntu-1804:
    runs-on: ubuntu-latest  
    steps:
      - uses: actions/checkout@v3
      - name: build
        run: |
          docker run -v /home/runner/work/yacoin/yacoin:/src -e BUILDVERSION=$GITHUB_RUN_NUMBER dev34253/yacoin-build:ubuntu.18.04-1
      - uses: actions/upload-artifact@v4
        with:
          name: yacoind-ubuntu-18.04
          path: /home/runner/work/yacoin/yacoin/release-root/bin/yacoind
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yacoin-qt-ubuntu-18.04-qt4
          path: /home/runner/work/yacoin/yacoin/release-root/bin/yacoin-qt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yacoin-cli-ubuntu-18.04
          path: /home/runner/work/yacoin/yacoin/release-root/bin/yacoin-cli
          if-no-files-found: error
  build-ubuntu-2004:
    runs-on: ubuntu-latest  
    steps:
      - uses: actions/checkout@v3
      - name: build
        run: |
          docker run -v /home/runner/work/yacoin/yacoin:/src -e BUILDVERSION=$GITHUB_RUN_NUMBER dev34253/yacoin-build:ubuntu.20.04-1
      - uses: actions/upload-artifact@v4
        with:
          name: yacoind-ubuntu-20.04
          path: /home/runner/work/yacoin/yacoin/release-root/bin/yacoind
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yacoin-qt-ubuntu-20.04-qt4
          path: /home/runner/work/yacoin/yacoin/release-root/bin/yacoin-qt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yacoin-cli-ubuntu-20.04
          path: /home/runner/work/yacoin/yacoin/release-root/bin/yacoin-cli
          if-no-files-found: error
  build-ubuntu-2204:
    runs-on: ubuntu-latest  
    steps:
      - uses: actions/checkout@v3
      - name: build
        run: |
          docker run -v /home/runner/work/yacoin/yacoin:/src -e BUILDVERSION=$GITHUB_RUN_NUMBER dev34253/yacoin-build:ubuntu.22.04-1
      - uses: actions/upload-artifact@v4
        with:
          name: yacoind-ubuntu-22.04
          path: /home/runner/work/yacoin/yacoin/release-root/bin/yacoind
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yacoin-qt-ubuntu-22.04-qt4
          path: /home/runner/work/yacoin/yacoin/release-root/bin/yacoin-qt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yacoin-cli-ubuntu-22.04
